<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lead Finder Pro — Encontre + Clientes</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-darkest: #010611;
      --bg-sidebar: #020916;
      --bg-card: #041026;
      --bg-badge-open: rgba(0, 221, 181, 0.12);
      --text-badge-open: #00ddb5;
      --bg-badge-nosite: #0e2246;
      --text-badge-nosite: #8ea8cf;
      --bg-pill-price: #0a1f4d;
      --btn-blue: #1767FF;
      --btn-blue-hover: #1f72ff;
      --border-subtle: #0f2752;
      --text-light: #e6f0ff;
      --text-dim: #7e9ac3;
      --yellow-star: #ffc928;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-darkest);
      color: var(--text-light);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-layout {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 270px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      gap: 20px;
      flex-shrink: 0;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-info h2 {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
    }

    .brand-info span {
      font-size: 11px;
      color: var(--btn-blue);
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      background: transparent;
      border: none;
      color: var(--text-dim);
      font-size: 13.5px;
      font-weight: 600;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .nav-btn:hover {
      color: #fff;
      background-color: rgba(23, 103, 255, 0.08);
    }

    .nav-btn.active {
      background-color: #0c2b69;
      color: #fff;
    }

    .filters-panel {
      border-top: 1px solid var(--border-subtle);
      padding-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .filters-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }

    .input-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-field label {
      font-size: 11.5px;
      color: var(--text-dim);
      font-weight: 600;
    }

    .input-field input, .input-field select {
      background-color: #020b1c;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      color: #fff;
      padding: 9px 12px;
      font-size: 13px;
      outline: none;
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
    }

    .switch {
      position: relative;
      width: 34px;
      height: 20px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }
    .track {
      position: absolute;
      inset: 0;
      background-color: #0d2347;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    .track:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .track { background-color: var(--btn-blue); }
    input:checked + .track:before { transform: translateX(14px); }

    .btn-search-glow {
      background-color: var(--btn-blue);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(23, 103, 255, 0.4);
      transition: background 0.15s;
    }

    .btn-search-glow:hover { background-color: var(--btn-blue-hover); }

    .status-footer {
      margin-top: auto;
      border-top: 1px solid var(--border-subtle);
      padding-top: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--text-badge-open);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--text-badge-open);
    }

    .content-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .navbar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(2, 9, 22, 0.7);
      backdrop-filter: blur(8px);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .search-input-pill {
      display: flex;
      align-items: center;
      background-color: #030d22;
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 6px 10px 6px 18px;
      width: 580px;
      gap: 12px;
    }

    .search-input-pill input {
      background: transparent;
      border: none;
      color: #fff;
      flex: 1;
      outline: none;
      font-size: 14px;
    }

    .btn-top-submit {
      background-color: var(--btn-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .badge-leads-count {
      background-color: #030d22;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 9px 16px;
      font-size: 13px;
      color: var(--text-dim);
    }

    .badge-leads-count strong { color: #fff; }

    .main-body { padding: 24px 32px; }

    .results-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .count-display {
      font-size: 14px;
      color: #fff;
      font-weight: 700;
    }

    .sort-dropdown {
      background-color: #030d22;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 12px;
      color: var(--text-dim);
      font-size: 13px;
    }

    .sort-dropdown select {
      background: transparent;
      border: none;
      color: #fff;
      outline: none;
      cursor: pointer;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 18px;
    }

    .lead-card-box {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }

    .lead-card-box:hover {
      border-color: #1a4387;
      transform: translateY(-3px);
    }

    .card-top-banner {
      height: 105px;
      background: linear-gradient(180deg, #184cc8 0%, #0d2f83 100%);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-fav-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
      opacity: 0.8;
      transition: 0.15s;
    }

    .card-fav-btn:hover { opacity: 1; }
    .card-fav-btn.active svg { fill: #ff4757; stroke: #ff4757; }

    .card-inner {
      padding: 14px 16px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card-business-name {
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-location-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
    }

    .badges-row {
      display: flex;
      gap: 6px;
      margin: 2px 0;
    }

    .pill-open {
      background-color: var(--bg-badge-open);
      color: var(--text-badge-open);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .pill-nosite {
      background-color: var(--bg-badge-nosite);
      color: var(--text-badge-nosite);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: #fff;
    }

    .rating-row svg {
      color: var(--yellow-star);
      fill: var(--yellow-star);
    }

    .rating-row span { color: var(--text-dim); }

    .price-pill-box {
      background-color: var(--bg-pill-price);
      border-radius: 10px;
      padding: 8px 14px;
      margin: 4px 0;
    }

    .price-label {
      font-size: 9.5px;
      letter-spacing: 0.6px;
      color: var(--text-dim);
      text-transform: uppercase;
      font-weight: 700;
    }

    .price-value {
      font-size: 14.5px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }

    .card-action-bar {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .btn-card-lead {
      background-color: var(--btn-blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }

    .btn-card-save {
      background-color: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 12px;
      color: #fff;
      cursor: pointer;
    }

    .btn-icon-square {
      background-color: transparent;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-icon-square:hover {
      color: #fff;
      border-color: var(--btn-blue);
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand-header">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#1767FF" stroke-width="2.2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="5"></line><line x1="12" y1="19" x2="12" y2="23"></line><line x1="1" y1="12" x2="5" y2="12"></line><line x1="19" y1="12" x2="23" y2="12"></line></svg>
        <div class="brand-info">
          <h2>Lead Finder</h2>
          <span>Encontre + clientes</span>
        </div>
      </div>

      <nav class="nav-links">
        <button class="nav-btn active" id="tabSearch">Buscar Leads</button>
        <button class="nav-btn" id="tabFavorites">Favoritos (<span id="favCount">0</span>)</button>
        <button class="nav-btn" id="btnExportCSV">Exportar Leads (CSV)</button>
      </nav>

      <div class="filters-panel">
        <div class="filters-header"><span>Filtros</span></div>
        <div class="input-field">
          <label>Nicho</label>
          <input type="text" id="filterNiche" value="Barbearia">
        </div>
        <div class="input-field">
          <label>Cidade</label>
          <input type="text" id="filterCity" value="Macacá, RJ">
        </div>
        <div class="toggle-row">
          <span>Apenas sem site</span>
          <label class="switch"><input type="checkbox" id="filterNoWebsite" checked><span class="track"></span></label>
        </div>
        <div class="toggle-row">
          <span>Com WhatsApp</span>
          <label class="switch"><input type="checkbox" id="filterHasPhone" checked><span class="track"></span></label>
        </div>
        <button id="btnSearch" class="btn-search-glow">Buscar</button>
      </div>

      <div class="status-footer">
        <div class="status-dot"></div>
        <span>Sistema Pronto & Online</span>
      </div>
    </aside>

    <main class="content-area">
      <header class="navbar-top">
        <div class="search-input-pill">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7E9AC3" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="topSearchInput" value="barbearia em macacá, rj">
          <button id="btnTopSubmit" class="btn-top-submit">Buscar</button>
        </div>
        <div class="badge-leads-count">Leads: <strong id="topCount">0</strong></div>
      </header>

      <section class="main-body">
        <div class="results-meta-bar">
          <span class="count-display"><strong id="resultsCount">0</strong> resultados encontrados</span>
          <div class="sort-dropdown">
            <select id="selectSort">
              <option value="rating">Ordenar por: Melhor avaliação</option>
              <option value="reviews">Ordenar por: Mais avaliados</option>
              <option value="name">Ordenar por: Nome A-Z</option>
            </select>
          </div>
        </div>

        <div id="leadsGrid" class="cards-grid"></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
